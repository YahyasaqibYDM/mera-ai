<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <title>AI Assistant by Yahya</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #212121;
            --bg-sidebar: #171717;
            --bg-input: #2f2f2f;
            --bg-hover: #2a2a2a;
            --text-primary: #ececec;
            --text-secondary: #b4b4b4;
            --border-color: #444;
            --accent: #10a37f;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 12px;
            flex-shrink: 0;
        }

        .brand {
            padding: 16px 12px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.3px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .brand span {
            color: var(--accent);
        }

        .new-chat-btn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
            font-family: inherit;
        }

        .new-chat-btn:hover {
            background: var(--bg-hover);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            line-height: 1.6;
        }

        /* ===== MAIN CHAT AREA ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            min-width: 0;
        }

        .topbar {
            height: 56px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background: var(--bg-main);
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            justify-content: space-between;
            flex-shrink: 0;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }

        /* ===== MESSAGES ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            min-height: 0;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #444;
        }
        .messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            display: flex;
            padding: 18px 24px;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message.user {
            background: var(--bg-main);
        }

        .message.ai {
            background: #2a2a2a;
        }

        .avatar {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            border: 1px solid var(--border-color);
        }

        .avatar.user-avatar {
            background: #5a5a5a;
        }

        .avatar.ai-avatar {
            background: var(--accent);
        }

        .message-content {
            flex: 1;
            line-height: 1.7;
            font-size: 15px;
            color: var(--text-primary);
            word-wrap: break-word;
            padding-top: 4px;
            min-width: 0;
            overflow-wrap: break-word;
        }

        .message-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        /* File preview in user message */
        .message-file-preview {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #333;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .message-file-preview img {
            max-width: 200px;
            max-height: 200px;
            display: block;
            margin-top: 8px;
            border: 1px solid var(--border-color);
        }

        /* ===== WELCOME SCREEN ===== */
        .welcome {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }

        .welcome h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 40px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            max-width: 640px;
            margin: 0 auto;
        }

        .suggestion {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-family: inherit;
        }

        .suggestion:hover {
            background: var(--bg-hover);
            border-color: #555;
            color: var(--text-primary);
        }

        .suggestion strong {
            display: block;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-size: 13px;
        }

        /* ===== INPUT AREA ===== */
        .input-container {
            padding: 16px 24px 24px;
            background: var(--bg-main);
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 8px 8px 8px 16px;
            transition: border-color 0.15s;
            position: relative;
        }

        .input-wrapper:focus-within {
            border-color: #666;
        }

        /* Attach button */
        .attach-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
            flex-shrink: 0;
            font-size: 18px;
            margin-right: 4px;
        }

        .attach-btn:hover {
            color: var(--accent);
        }

        .attach-btn svg {
            width: 20px;
            height: 20px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            padding: 10px 8px;
            max-height: 200px;
            line-height: 1.5;
            min-width: 0;
        }

        textarea::placeholder {
            color: #777;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            opacity: 0.85;
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        /* File preview before sending */
        .file-preview-box {
            max-width: 900px;
            margin: 0 auto 8px;
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .file-preview-box.active {
            display: flex;
        }

        .file-preview-box img {
            max-width: 50px;
            max-height: 50px;
            border: 1px solid var(--border-color);
        }

        .file-preview-box .file-icon {
            font-size: 24px;
        }

        .file-preview-box .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-preview-box .file-name {
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-preview-box .file-size {
            font-size: 11px;
            color: #777;
        }

        .file-preview-box .remove-file {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.15s;
        }

        .file-preview-box .remove-file:hover {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .input-hint {
            max-width: 900px;
            margin: 10px auto 0;
            font-size: 11px;
            color: #777;
            text-align: center;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== MARKDOWN STYLES ===== */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin: 14px 0 8px 0;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .message-content h1 { font-size: 20px; }
        .message-content h2 { font-size: 18px; }
        .message-content h3 { font-size: 16px; }
        .message-content h4 { font-size: 15px; }

        .message-content p {
            margin: 8px 0;
            line-height: 1.7;
        }

        .message-content ul,
        .message-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message-content li {
            margin: 4px 0;
            line-height: 1.6;
        }

        .message-content strong {
            font-weight: 700;
            color: #fff;
        }

        .message-content em {
            font-style: italic;
        }

        .message-content code {
            background: #1a1a1a;
            padding: 2px 6px;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            border: 1px solid var(--border-color);
            color: #ff9b9b;
        }

        .message-content pre {
            background: #1a1a1a;
            padding: 12px 14px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            font-size: 13px;
            line-height: 1.5;
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
            border: none;
            color: var(--text-primary);
        }

        .message-content table {
            border-collapse: collapse;
            margin: 12px 0;
            width: 100%;
            font-size: 13px;
            display: block;
            overflow-x: auto;
        }

        .message-content th,
        .message-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        .message-content th {
            background: #333;
            font-weight: 600;
            color: #fff;
        }

        .message-content tr:nth-child(even) {
            background: #232323;
        }

        .message-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 14px;
            margin: 10px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .message-content hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 16px 0;
        }

        .message-content a {
            color: var(--accent);
            text-decoration: underline;
        }

        .message-content pre::-webkit-scrollbar {
            height: 8px;
        }
        .message-content pre::-webkit-scrollbar-thumb {
            background: #444;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 16px;
            }

            .message {
                padding: 14px 16px;
                gap: 12px;
            }

            .avatar {
                width: 26px;
                height: 26px;
                font-size: 11px;
            }

            .message-content {
                font-size: 14px;
            }

            .welcome {
                padding: 40px 16px;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .welcome p {
                font-size: 14px;
                margin-bottom: 28px;
            }

            .suggestions {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .suggestion {
                padding: 10px 12px;
                font-size: 12px;
            }

            .suggestion strong {
                font-size: 12px;
                margin-bottom: 2px;
            }

            .input-container {
                padding: 12px 16px 16px;
                padding-bottom: calc(16px + env(safe-area-inset-bottom));
            }

            .input-hint {
                font-size: 10px;
                margin-top: 8px;
            }

            .message-content table {
                font-size: 12px;
            }

            .message-content th,
            .message-content td {
                padding: 6px 8px;
            }

            .message-file-preview img {
                max-width: 150px;
                max-height: 150px;
            }
        }

        @media (max-width: 400px) {
            .suggestions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">AI Assistant <span>by Yahya</span></div>
            <button class="new-chat-btn" onclick="newChat()">
                <span>＋</span>
                <span>New Chat</span>
            </button>
            <div class="sidebar-footer">
                Powered by AI Integration<br>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="main">
            <div class="topbar">
                <span>AI Assistant</span>
                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>
            </div>

            <div class="messages" id="messages">
                <!-- Welcome Screen -->
                <div class="welcome" id="welcome">
                    <h1>How can I help you today?</h1>
                    <p>Ask me anything — or upload an image/PDF to analyze</p>
                    <div class="suggestions">
                        <button class="suggestion" onclick="useSuggestion('How do I read a file in Python?')">
                            <strong>Python Help</strong>
                            How to read a file?
                        </button>
                        <button class="suggestion" onclick="useSuggestion('Help me write a professional email')">
                            <strong>Write an Email</strong>
                            Professional email draft
                        </button>
                        <button class="suggestion" onclick="useSuggestion('What is AI? Explain in simple terms')">
                            <strong>Learn a Concept</strong>
                            What is AI?
                        </button>
                        <button class="suggestion" onclick="useSuggestion('Suggest a small business idea')">
                            <strong>Business Idea</strong>
                            Startup suggestion
                        </button>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <!-- File Preview Box -->
                <div class="file-preview-box" id="filePreview">
                    <div id="filePreviewContent"></div>
                    <div class="file-info">
                        <div class="file-name" id="fileName"></div>
                        <div class="file-size" id="fileSize"></div>
                    </div>
                    <button class="remove-file" onclick="removeFile()">✕</button>
                </div>

                <div class="input-wrapper">
                    <!-- Hidden file input -->
                    <input type="file" id="fileInput" style="display:none" 
                           accept="image/*,.pdf,.txt,.csv,.md"
                           onchange="handleFileSelect(event)">
                    
                    <!-- Attach button -->
                    <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>

                    <textarea 
                        id="userInput" 
                        placeholder="Type your message here..." 
                        rows="1"
                        autofocus
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">AI can make mistakes. Please verify important information.</div>
            </div>
        </main>
    </div>

    <script>
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: false,
            mangle: false
        });

        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const filePreviewContent = document.getElementById('filePreviewContent');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');

        let selectedFile = null;

        // Auto-resize textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        });

        // Enter to send
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendMessage();
            }
        });

        function useSuggestion(text) {
            userInput.value = text;
            sendMessage();
        }

        function hideWelcome() {
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.remove();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Size check (20MB)
            if (file.size > 20 * 1024 * 1024) {
                alert('File 20MB se bari hai. Chhoti file select karein.');
                fileInput.value = '';
                return;
            }

            selectedFile = file;
            
            // Show preview
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            
            // Image preview
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    filePreviewContent.innerHTML = `<img src="${e.target.result}" alt="preview">`;
                };
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                filePreviewContent.innerHTML = '<span class="file-icon">📄</span>';
            } else {
                filePreviewContent.innerHTML = '<span class="file-icon">📝</span>';
            }
            
            filePreview.classList.add('active');
        }

        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            filePreview.classList.remove('active');
            filePreviewContent.innerHTML = '';
        }

        function addMessage(text, sender, fileInfo = null) {
            hideWelcome();
            
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            
            const initial = sender === 'user' ? 'Y' : 'AI';
            
            let fileHtml = '';
            if (fileInfo) {
                if (fileInfo.type && fileInfo.type.startsWith('image/') && fileInfo.dataUrl) {
                    fileHtml = `<div class="message-file-preview"><img src="${fileInfo.dataUrl}" alt="${fileInfo.name}"></div>`;
                } else {
                    const icon = fileInfo.type === 'application/pdf' ? '📄' : '📝';
                    fileHtml = `<div class="message-file-preview">${icon} ${fileInfo.name} (${formatFileSize(fileInfo.size)})</div>`;
                }
            }
            
            div.innerHTML = `
                <div class="avatar ${sender === 'user' ? 'user-avatar' : 'ai-avatar'}">${initial}</div>
                <div class="message-content">
                    <div class="message-label">${sender === 'user' ? 'You' : 'AI Assistant'}</div>
                    ${fileHtml}
                    <div class="text"></div>
                </div>
            `;
            
            const textDiv = div.querySelector('.text');
            
            if (sender === 'ai') {
                textDiv.innerHTML = marked.parse(text);
            } else {
                textDiv.textContent = text;
            }
            
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }

        function showTyping() {
            hideWelcome();
            
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="avatar ai-avatar">AI</div>
                <div class="message-content">
                    <div class="message-label">AI Assistant</div>
                    <div class="typing"><span></span><span></span><span></span></div>
                </div>
            `;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            
            if (!text && !selectedFile) return;

            // File info for display
            let fileInfo = null;
            if (selectedFile) {
                fileInfo = {
                    name: selectedFile.name,
                    size: selectedFile.size,
                    type: selectedFile.type
                };
                
                // Image data URL for preview
                if (selectedFile.type.startsWith('image/')) {
                    fileInfo.dataUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(selectedFile);
                    });
                }
            }

            addMessage(text || '(File uploaded)', 'user', fileInfo);
            
            // Prepare form data
            const formData = new FormData();
            if (text) formData.append('message', text);
            if (selectedFile) formData.append('file', selectedFile);

            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            removeFile();
            
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                removeTyping();
                
                if (data.error) {
                    addMessage('Error: ' + data.error, 'ai');
                } else {
                    addMessage(data.reply, 'ai');
                }
            } catch (err) {
                removeTyping();
                addMessage('Connection error. Is the server running?', 'ai');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        function newChat() {
            if (!confirm('Start a new chat? Current chat will be cleared.')) return;
            
            messagesDiv.innerHTML = `
                <div class="welcome" id="welcome">
                    <h1>How can I help you today?</h1>
                    <p>Ask me anything — or upload an image/PDF to analyze</p>
                    <div class="suggestions">
                        <button class="suggestion" onclick="useSuggestion('How do I read a file in Python?')">
                            <strong>Python Help</strong>
                            How to read a file?
                        </button>
                        <button class="suggestion" onclick="useSuggestion('Help me write a professional email')">
                            <strong>Write an Email</strong>
                            Professional email draft
                        </button>
                        <button class="suggestion" onclick="useSuggestion('What is AI? Explain in simple terms')">
                            <strong>Learn a Concept</strong>
                            What is AI?
                        </button>
                        <button class="suggestion" onclick="useSuggestion('Suggest a small business idea')">
                            <strong>Business Idea</strong>
                            Startup suggestion
                        </button>
                    </div>
                </div>
            `;
            
            removeFile();
            fetch('/clear', {method: 'POST'}).catch(() => {});
            userInput.focus();
        }

        userInput.focus();
    </script>
</body>
</html>
